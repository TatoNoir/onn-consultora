<section id="servicios" class="services">
  <div class="services__inner">
    <div class="services__header reveal" appReveal>
      <p class="services__eyebrow">Servicios</p>
      <h2 class="services__title">
        Del caos al <span class="services__title-accent">control</span>
      </h2>

      <div class="services__filters">
        @for (pf of painFilters; track pf.id) {
          <button
            type="button"
            class="services__filter"
            [class.services__filter--active]="filter() === pf.id"
            (click)="setFilter(pf.id)"
          >
            {{ pf.label }}
          </button>
        }
      </div>
    </div>

    <div class="services__grid">
      @for (service of filtered(); track service.title; let i = $index) {
        <article
          class="service-card"
          [@cardReveal]="{ value: 'card', params: { duration: 300, delay: i * 60 } }"
        >
          <div class="service-card__icon">
            <svg
              class="service-card__icon-svg"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              @switch (service.id) {
                @case ('organization') {
                  <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" />
                }
                @case ('contable') {
                  <rect width="16" height="20" x="4" y="2" rx="2" />
                  <line x1="8" x2="16" y1="6" y2="6" />
                  <line x1="16" x2="16" y1="14" y2="18" />
                  <path d="M16 10h.01" />
                  <path d="M12 10h.01" />
                  <path d="M8 10h.01" />
                  <path d="M12 14h.01" />
                  <path d="M8 14h.01" />
                  <path d="M12 18h.01" />
                  <path d="M8 18h.01" />
                }
                @case ('financiero') {
                  <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                  <polyline points="16 7 22 7 22 13" />
                }
                @case ('estrategia') {
                  <circle cx="12" cy="12" r="10" />
                  <circle cx="12" cy="12" r="6" />
                  <circle cx="12" cy="12" r="2" />
                }
                @case ('soporte') {
                  <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" />
                }
              }
            </svg>
          </div>

          <h3 class="service-card__title">{{ service.title }}</h3>

          <ul class="service-card__list">
            @for (item of service.items; track item) {
              <li class="service-card__item">
                <span class="service-card__bullet" aria-hidden="true">•</span>
                {{ item }}
              </li>
            }
          </ul>

          <a class="service-card__link" href="#contacto">
            Consultar
            <svg
              class="service-card__link-arrow"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </a>
        </article>
      }
    </div>
  </div>
</section>
